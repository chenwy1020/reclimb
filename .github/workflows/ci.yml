name: Windows checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      test_scope:
        description: 'auto uses this patch release profile; full runs all accumulated tests'
        type: choice
        options: [auto, full]
        default: auto
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-checks:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm run typecheck
      - run: node scripts/test-profile.mjs
        id: tests
        env:
          RECLIMB_TEST_SCOPE: ${{ inputs.test_scope || 'auto' }}
      - run: npm run build
      - run: npm run test:desktop:full
        if: steps.tests.outputs.scope == 'full'
      - run: npm run test:desktop
        if: steps.tests.outputs.scope == 'targeted'
      - run: node scripts/audit-source.mjs --tracked
